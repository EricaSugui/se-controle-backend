paths:
  convites:
    get:
      tags: [Convites]
      summary: Lista convites
      description: >
        Retorna convites de casas das quais o usuário autenticado é admin, e
        convites sem casa (auto-cadastro) criados pelo próprio usuário. A
        resposta nunca inclui o campo `token`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pendente, aceito, expirado]
          example: pendente
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          example: convidado@email.com
      responses:
        "200":
          description: Lista de convites (sem o campo token)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/ConviteSemToken"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"
    post:
      tags: [Convites]
      summary: Cria convite interno ou envia convite por e-mail
      description: >
        O backend verifica primeiro se o endereço pertence a uma conta Supabase.
        Se já existir uma conta, cria um convite interno para a pessoa receber
        uma notificação no sistema. Caso contrário, cria o convite e solicita
        ao Supabase o envio do e-mail de cadastro. Se o endereço já corresponder
        a uma pessoa sem login, o aceite vincula a nova conta à pessoa existente,
        preservando seu histórico. `convidado_por_id` é sempre o usuário
        autenticado. Quando `casa_id` é informado, o usuário precisa ser admin
        daquela casa; sem `casa_id`, o fluxo de convite por e-mail permanece
        disponível para auto-cadastro.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/schemas/ConviteInput"
      responses:
        "201":
          description: Convite interno criado ou convite por e-mail enviado (sem o campo token)
          content:
            application/json:
              schema:
                $ref: "#/schemas/ConviteSemToken"
        "400":
          $ref: "../components/responses.yml#/responses/ErroValidacao"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"
        "403":
          $ref: "../components/responses.yml#/responses/SemPermissao"


  convites-recebidos:
    get:
      tags: [Convites]
      summary: Lista convites recebidos pela pessoa autenticada
      description: Retorna convites internos pendentes enviados para a pessoa autenticada.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Convites recebidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/schemas/ConviteRecebido"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"

  convites-recebidos-id-aceitar:
    patch:
      tags: [Convites]
      summary: Aceita um convite interno e entra na casa
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../components/parameters.yml#/parameters/Id"
      responses:
        "200":
          description: Convite aceito
          content:
            application/json:
              schema:
                $ref: "#/schemas/ConviteSemToken"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"
        "404":
          $ref: "../components/responses.yml#/responses/NaoEncontrado"

  convites-token-token:
    get:
      tags: [Convites]
      summary: Busca um convite pelo token
      parameters:
        - $ref: "../components/parameters.yml#/parameters/ConviteToken"
      responses:
        "200":
          description: Convite encontrado
          content:
            application/json:
              schema:
                $ref: "#/schemas/Convite"
        "404":
          $ref: "../components/responses.yml#/responses/NaoEncontrado"

  convites-token-token-aceitar:
    patch:
      tags: [Convites]
      summary: Aceita um convite — fluxo completo de cadastro
      description: >
        Valida o Bearer token do Supabase, confere se o email bate com o do convite,
        localiza ou cria a pessoa correspondente, vincula o supabase_user_id,
        adiciona à casa_pessoas (se o convite tiver casa_id) e marca o convite
        como aceito. Quando já existe uma pessoa sem login, preserva seu cadastro
        e histórico. Tudo em uma transação atômica.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../components/parameters.yml#/parameters/ConviteToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  description: Nome da pessoa. Se omitido, usa o e-mail como nome inicial.
                  example: Marcela
      responses:
        "200":
          description: Convite aceito — retorna a pessoa vinculada à conta
          content:
            application/json:
              schema:
                $ref: "./pessoas.yml#/schemas/Pessoa"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"
        "403":
          description: Email do usuário não corresponde ao convite
          content:
            application/json:
              schema:
                $ref: "../components/common-schemas.yml#/schemas/Erro"
        "404":
          $ref: "../components/responses.yml#/responses/NaoEncontrado"
        "409":
          description: Convite já utilizado, expirado ou usuário já vinculado
          content:
            application/json:
              schema:
                $ref: "../components/common-schemas.yml#/schemas/Erro"

  convites-id:
    get:
      tags: [Convites]
      summary: Busca um convite pelo id
      description: >
        Requer que o usuário autenticado seja admin da casa do convite, ou
        (se o convite não tiver casa) que tenha sido quem o criou.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../components/parameters.yml#/parameters/Id"
      responses:
        "200":
          description: Convite encontrado (sem o campo token)
          content:
            application/json:
              schema:
                $ref: "#/schemas/ConviteSemToken"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"
        "404":
          $ref: "../components/responses.yml#/responses/NaoEncontrado"

  convites-id-aceitar:
    patch:
      tags: [Convites]
      summary: Marca um convite como aceito (uso administrativo)
      description: >
        Altera apenas o status do convite para "aceito", sem criar pessoa nem
        acionar Supabase. Use para correções manuais. Requer que o usuário
        autenticado seja admin da casa do convite, ou (se o convite não tiver
        casa) que tenha sido quem o criou.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../components/parameters.yml#/parameters/Id"
      responses:
        "200":
          description: Convite marcado como aceito (sem o campo token)
          content:
            application/json:
              schema:
                $ref: "#/schemas/ConviteSemToken"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"
        "403":
          $ref: "../components/responses.yml#/responses/SemPermissao"
        "404":
          $ref: "../components/responses.yml#/responses/NaoEncontrado"

  convites-id-expirar:
    patch:
      tags: [Convites]
      summary: Expira um convite pendente
      description: >
        Requer que o usuário autenticado seja admin da casa do convite, ou
        (se o convite não tiver casa) que tenha sido quem o criou.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../components/parameters.yml#/parameters/Id"
      responses:
        "200":
          description: Convite expirado (sem o campo token)
          content:
            application/json:
              schema:
                $ref: "#/schemas/ConviteSemToken"
        "401":
          $ref: "../components/responses.yml#/responses/NaoAutenticado"
        "403":
          $ref: "../components/responses.yml#/responses/SemPermissao"
        "404":
          $ref: "../components/responses.yml#/responses/NaoEncontrado"

schemas:
  ConviteInput:
    type: object
    required: [email]
    properties:
      email:
        type: string
        format: email
        example: convidado@email.com
      casa_id:
        type: integer
        nullable: true
        description: >
          Se informado, o usuário autenticado precisa ser admin desta casa.
          Se omitido, o convite é de auto-cadastro (sem casa).
        example: 1
      papel:
        type: string
        enum: [admin, membro]
        nullable: true
        example: membro
      expires_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-07-25T23:59:59Z"

  Convite:
    type: object
    properties:
      id:
        type: integer
        example: 1
      email:
        type: string
        format: email
        example: convidado@email.com
      convidado_por_id:
        type: integer
        readOnly: true
        description: Definido automaticamente pelo servidor a partir do usuário autenticado na criação.
        example: 7
      casa_id:
        type: integer
        nullable: true
        example: 1
      papel:
        type: string
        enum: [admin, membro]
        nullable: true
        example: membro
      token:
        type: string
        example: a3f8c2d1e4b7...
      status:
        type: string
        enum: [pendente, aceito, expirado]
        example: pendente
      expires_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-07-25T23:59:59Z"
      created_at:
        type: string
        format: date-time
      tipo:
        type: string
        enum: [email, interno]

  ConviteRecebido:
    type: object
    properties:
      id:
        type: integer
      email:
        type: string
        format: email
      casa_id:
        type: integer
      casa_nome:
        type: string
      papel:
        type: string
        enum: [admin, membro]
      status:
        type: string
        enum: [pendente, aceito, expirado]
      tipo:
        type: string
        enum: [email, interno]
      convidado_por_nome:
        type: string
      expires_at:
        type: string
        format: date-time
        nullable: true
      created_at:
        type: string
        format: date-time

  ConviteSemToken:
    type: object
    description: >
      Mesma forma de Convite, mas sem o campo token — usado em todas as
      respostas autenticadas (GET /convites, GET /convites/{id}, POST
      /convites, aceitar/expirar por id). O token só é exposto via
      GET /convites/token/{token}, que já exige conhecê-lo de antemão.
    properties:
      id:
        type: integer
        example: 1
      email:
        type: string
        format: email
        example: convidado@email.com
      convidado_por_id:
        type: integer
        readOnly: true
        example: 7
      casa_id:
        type: integer
        nullable: true
        example: 1
      papel:
        type: string
        enum: [admin, membro]
        nullable: true
        example: membro
      status:
        type: string
        enum: [pendente, aceito, expirado]
        example: pendente
      expires_at:
        type: string
        format: date-time
        nullable: true
        example: "2026-07-25T23:59:59Z"
      created_at:
        type: string
        format: date-time
      tipo:
        type: string
        enum: [email, interno]
      interno:
        type: boolean
        description: Indica que a pessoa já possui conta e receberá uma notificação no sistema.
